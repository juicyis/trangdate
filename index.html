<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Girlfriend's Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ffb6c1,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    max-width:600px;
}

h1{
    color:#ff3d81;
    margin-bottom:15px;
}

p{
    margin-bottom:35px;
    font-size:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:15px;
    transition:.25s;
    font-weight:bold;
}

#yesBtn{
    background:#4CAF50;
    color:white;
    padding:18px 40px;
    font-size:24px;
}

#noBtn{
    background:#ff4d4d;
    color:white;
    padding:18px 40px;
    font-size:24px;
}

button:hover{
    transform:scale(1.08);
}
</style>

</head>
<body>

<div class="container">

<h1>❤️ Happy National Girlfriend's Day ❤️</h1>

<p>
Will you go on a date with me? 🥹
</p>

<div class="buttons">
<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO</button>
</div>

</div>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let scale = 1;

const noMessages = [
"Are you sure? 🥺",
"Really sure? 😢",
"Think again ❤️",
"Pretty please? 🥹",
"I'll bring snacks 🍿",
"I'll buy dessert 🍰",
"What if I give you flowers? 🌹",
"You know you want to 😏",
"Last chance... ❤️",
"Okay...but the YES button looks pretty good."
];

let clickCount = 0;

noBtn.addEventListener("click", () => {

    scale += 0.35;

    yesBtn.style.transform = `scale(${scale})`;

    if(scale > 2.2){
        yesBtn.style.fontSize = "34px";
    }

    if(clickCount < noMessages.length){
        noBtn.textContent = noMessages[clickCount];
    }else{
        noBtn.textContent = "Still no? 😭";
    }

    clickCount++;

});

yesBtn.addEventListener("click", () => {

    document.body.innerHTML = `
    <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ffb6c1,#ffd6e8);
    font-family:Arial;
    text-align:center;
    ">
        <div>
            <h1 style="font-size:60px;color:#ff3d81;">YAY!! ❤️</h1>
            <p style="font-size:28px;margin-top:20px;">
            I can't wait for our date 🥰
            </p>
            <p>Redirecting...</p>
        </div>
    </div>
    `;

    setTimeout(()=>{
        window.location.href="https://partiful.com/e/n5Iia8Xfn96D6NjuiqIU?c=oBI8SMAx";
    },2500);

});

</script>

</body>
</html>
